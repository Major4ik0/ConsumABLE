name: Build ConsumABLE Windows EXE

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Prepare icon
        shell: bash
        run: |
          python -c "
          import os
          from PIL import Image
          if os.path.exists('icon.png'):
              img = Image.open('icon.png')
              img.save('icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
              print('icon.ico created successfully')
          else:
              print('Warning: icon.png not found, building without icon')
          "

      - name: Build Executable with PyInstaller
        shell: cmd
        run: |
          if exist icon.ico (
            pyinstaller --noconsole --onefile --clean --icon=icon.ico --hidden-import=PyQt5.QtSvg --add-data "icon.png;." --name "ConsumABLE" main.py
          ) else (
            pyinstaller --noconsole --onefile --clean --hidden-import=PyQt5.QtSvg --name "ConsumABLE" main.py
          )

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConsumABLE-Windows-x64
          path: dist/ConsumABLE.exe
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ConsumABLE.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
